services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: launchforensics
      POSTGRES_PASSWORD: launchforensics
      POSTGRES_DB: launchforensics
    ports:
      - "5432:5432"
    volumes:
      - launchforensics_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchforensics -d launchforensics"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  launchforensics_pg:
